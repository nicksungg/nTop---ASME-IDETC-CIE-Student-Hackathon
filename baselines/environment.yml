# Conda environment for the optimizer baselines (versions the benchmark was run with).
#
#   PYTHONNOUSERSITE=1 conda env create -f environment.yml
#   conda activate bwb-baselines
#   python bo_bench/smoke_test.py
#
# PYTHONNOUSERSITE=1 stops pip from counting packages in ~/.local as already installed,
# so the environment gets its own copies. The `variables` entry below keeps ~/.local
# out of the environment after activation too.
#
# torch from PyPI ships CUDA 12.x on Linux and runs on CPU when no GPU is present.
# TabPFN downloads its model weights on first use (needs internet once).
name: bwb-baselines
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  - pip
  - pip:
      - numpy==2.3.5
      - scipy==1.17.1
      - pandas==2.3.3
      - matplotlib==3.10.3
      - scikit-learn==1.6.1   # models/*.joblib were pickled with 1.6.1
      - joblib==1.5.1
      - torch==2.7.1
      - gpytorch==1.15.2
      - botorch==0.18.1       # SCBO, qLogNEI, qLogNEHVI
      - tabpfn==2.1.0         # TabPFN-CEI, TabPFN-UCB
      - cma==4.4.4            # CMA-ES
      - pymoo==0.6.2          # NSGA-II
variables:
  PYTHONNOUSERSITE: "1"
